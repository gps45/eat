<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Menú Digital Rápido</title>
  <style>
    :root {
      --primary: #E63946;
      --bg: #111315;
      --card: #1b1e23;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 95px; overflow-x: hidden; }
    header { padding: 20px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
    header img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(34,197,94,0.15); color: #4ade80; margin-top: 4px; }
    .badge.cerrado { background: rgba(239,68,68,0.15); color: #f87171; }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; position: sticky; top: 0; background: var(--bg); z-index: 10; border-bottom: 1px solid var(--border); scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; font-size: 14px; }
    .cat-btn.active { background: var(--primary); border-color: var(--primary); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding: 16px; max-width: 960px; margin: 0 auto; }
    .item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; gap: 12px; padding: 10px; cursor: pointer; transition: transform .15s; }
    .item:active { transform: scale(0.99); }
    .item img { width: 88px; height: 88px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .item-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .item-title { font-weight: 700; font-size: 15px; }
    .item-desc { color: var(--muted); font-size: 12px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .price { font-weight: 700; color: var(--primary); font-size: 15px; }
    .agotado { opacity: 0.55; }
    .tag-agotado { font-size: 11px; background: #ef4444; color: #fff; padding: 2px 6px; border-radius: 6px; font-weight: 600; }

    /* Barra inferior del carrito */
    .cart-bar { position: fixed; bottom: 14px; left: 16px; right: 16px; max-width: 928px; margin: 0 auto; background: var(--primary); color: #fff; padding: 15px 18px; border-radius: 14px; display: none; justify-content: space-between; align-items: center; font-weight: 700; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.45); z-index: 20; }

    /* Modales Pantalla Completa */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      z-index: 50;
      overflow: hidden;
    }
    .modal-backdrop.open { display: flex; flex-direction: column; }

    .modal-fs {
      width: 100%;
      height: 100dvh;
      max-width: 640px;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.22s ease-out;
      will-change: transform;
    }

    /* Botón flotante X arriba */
    .floating-close {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 70;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(17, 19, 21, 0.82);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .floating-close:active { transform: scale(0.94); }

    .swipe-hint {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 65;
      background: rgba(17, 19, 21, 0.72);
      backdrop-filter: blur(6px);
      color: #e5e7eb;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      pointer-events: none;
    }

    .modal-scroll {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 110px;
    }

    /* Hero imagen producto */
    .product-hero {
      width: 100%;
      height: 270px;
      background: var(--card);
      position: relative;
      overflow: hidden;
    }
    .product-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .product-hero.no-img {
      height: 76px;
      background: transparent;
    }

    .modal-content { padding: 18px 16px; }
    .product-header-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }
    .product-header-info h2 { font-size: 22px; font-weight: 800; line-height: 1.2; }
    .product-base-price { font-size: 20px; font-weight: 800; color: var(--primary); white-space: nowrap; }
    .product-desc-full { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #e5e7eb;
      margin: 18px 0 10px;
    }

    /* Extras tipo tarjeta táctil */
    .extra-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .extra-card.selected {
      border-color: var(--primary);
      background: rgba(230, 57, 70, 0.1);
    }
    .extra-left { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; }
    .extra-left input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .extra-price { font-weight: 700; color: var(--primary); font-size: 14px; }

    .field { margin-top: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
    }

    /* Footer fijo modal producto */
    .modal-footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 640px;
      margin: 0 auto;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 65;
    }
    .qty-selector-lg {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
    }
    .qty-selector-lg button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 9px;
      background: var(--card);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .qty-selector-lg span {
      min-width: 34px;
      text-align: center;
      font-weight: 800;
      font-size: 16px;
    }
    .btn-primary {
      flex: 1;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Cabecera Carrito Pantalla Completa */
    .cart-top-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      position: sticky;
      top: 0;
      z-index: 60;
    }
    .cart-top-header h2 { font-size: 19px; font-weight: 800; }
    .cart-close-inline {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .invite-banner {
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      display: none;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      gap: 10px;
    }
    .qty-box { display: flex; align-items: center; gap: 8px; }
    .qty-box button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: #fff; font-weight: 700; cursor: pointer; }

    /* Botones de Propina */
    .tip-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .tip-btn {
      padding: 12px 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: transform .12s, background .15s, color .15s;
    }
    .tip-btn.active {
      background: #ffffff;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    /* Botón GPS Ubicación */
    .gps-btn {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px dashed var(--primary);
      background: rgba(230, 57, 70, 0.12);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .gps-btn.ready {
      border-style: solid;
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
    }
    .gps-error {
      color: #f87171;
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }

    /* Opciones visuales Método de Pago */
    .pay-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }
    .pay-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }
    .pay-card.selected {
      border-color: var(--primary);
      background: rgba(230, 57, 70, 0.12);
    }
    .pay-radio {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pay-card.selected .pay-radio {
      border-color: var(--primary);
    }
    .pay-card.selected .pay-radio::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
    }

    .summary-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.8;
    }
    .summary-line { display: flex; justify-content: space-between; }
    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 800;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 6px;
      color: #fff;
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-whatsapp {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #16a34a;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-whatsapp:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-invite {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--primary);
      background: rgba(230, 57, 70, 0.14);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img id="logo" src="" alt="Logo" />
    <div>
      <h1 id="biz-name" style="font-size:19px;">Cargando...</h1>
      <p id="biz-slogan" style="font-size:13px; color:var(--muted);"></p>
      <span id="biz-status" class="badge">ABIERTO</span>
    </div>
  </header>

  <div class="cats" id="cats"></div>
  <main class="grid" id="menu"></main>

  <div class="cart-bar" id="cart-bar" onclick="openCartModal()">
    <span id="cart-count">0 items</span>
    <span id="cart-total">$0.00</span>
  </div>

  <!-- Modal 1: Detalle y Extras a Pantalla Completa -->
  <div class="modal-backdrop" id="item-modal">
    <div class="modal-fs" id="item-modal-sheet">
      <span class="swipe-hint">→ Desliza para volver</span>
      <button class="floating-close" onclick="closeModal('item-modal')" aria-label="Cerrar">✕</button>

      <div class="modal-scroll">
        <div class="product-hero" id="m-hero">
          <img id="m-img" src="" alt="" />
        </div>

        <div class="modal-content">
          <div class="product-header-info">
            <h2 id="m-title">Plato</h2>
            <span class="product-base-price" id="m-price">$0.00</span>
          </div>
          <p class="product-desc-full" id="m-desc"></p>

          <div id="m-extras-wrap">
            <div class="section-title">Personaliza tu pedido</div>
            <div id="m-extras"></div>
          </div>

          <div class="field">
            <label>Notas especiales (opcional)</label>
            <input type="text" id="m-note" placeholder="Ej. Sin cebolla, bien cocido..." />
          </div>
        </div>
      </div>

      <div class="modal-footer-bar">
        <div class="qty-selector-lg">
          <button type="button" onclick="changeModalQty(-1)">−</button>
          <span id="m-qty">1</span>
          <button type="button" onclick="changeModalQty(1)">+</button>
        </div>
        <button class="btn-primary" id="m-add-btn">Agregar al pedido</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Carrito a Pantalla Completa -->
  <div class="modal-backdrop" id="cart-modal">
    <div class="modal-fs" id="cart-modal-sheet">
      <div class="cart-top-header">
        <div>
          <h2>Tu Pedido</h2>
          <span style="font-size:11px; color:var(--muted);">Desliza de izquierda a derecha para regresar</span>
        </div>
        <button class="cart-close-inline" onclick="closeModal('cart-modal')" aria-label="Cerrar">✕</button>
      </div>

      <div class="modal-scroll" style="padding: 16px 16px 40px;">
        <div class="invite-banner" id="invite-banner">
          🎁 Tu amig@ armó este carrito para ti. Revisa, completa ubicación/pago y envía el pedido.
        </div>

        <div id="cart-items"></div>

        <!-- Propina -->
        <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);">
          <div style="font-weight: 800; font-size: 15px;">¿Deseas añadir alguna propina?</div>
          <div class="tip-grid" id="tip-grid">
            <button type="button" class="tip-btn active" data-tip="0" onclick="selectTip(0)">0%</button>
            <button type="button" class="tip-btn" data-tip="5" onclick="selectTip(5)">5%</button>
            <button type="button" class="tip-btn" data-tip="10" onclick="selectTip(10)">10%</button>
            <button type="button" class="tip-btn" data-tip="15" onclick="selectTip(15)">15%</button>
            <button type="button" class="tip-btn" data-tip="20" onclick="selectTip(20)">20%</button>
          </div>
        </div>

        <!-- Tipo de entrega -->
        <div class="field">
          <label>Tipo de entrega</label>
          <select id="c-delivery" onchange="onDeliveryChange()">
            <option value="Domicilio">A domicilio</option>
            <option value="Retirar en local">Retirar en local</option>
          </select>
        </div>

        <!-- Ubicación GPS obligatoria en domicilio -->
        <div class="field" id="gps-field">
          <label>Ubicación de entrega (obligatoria a domicilio)</label>
          <button type="button" class="gps-btn" id="gps-btn" onclick="captureLocation()">
            📍 Dar mi ubicación actual
          </button>
          <div class="gps-error" id="gps-error"></div>
        </div>

        <!-- Método de pago (sin preselección) -->
        <div class="field">
          <label>Método de pago</label>
          <div class="pay-options" id="pay-options"></div>
        </div>

        <!-- Resumen -->
        <div class="summary-box" id="cart-summary"></div>

        <!-- Botones de acción -->
        <div class="action-stack" id="cart-actions">
          <button type="button" class="btn-whatsapp" id="send-wa-btn" onclick="sendWhatsApp()">
            Enviar pedido por WhatsApp
          </button>
          <button type="button" class="btn-invite" onclick="shareInviteWhatsApp()">
            🎁 Tu amig@ hoy invita (Enviar enlace del carrito)
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // REEMPLAZA ESTE ID CON EL DE TU GOOGLE SHEET
    const SHEET_ID = '1K6hvGEKgCuVbz0Mi7RaCuYbF-ES1Jtyk6O8Mo3o5KRg';
    const STORAGE_KEY = 'menu_digital_delivery_v2';

    let config = {
      nombre_negocio: 'Mi Restaurante',
      slogan: '',
      logo_url: '',
      color_principal: '#E63946',
      color_fondo: '#111315',
      whatsapp: '593999999999',
      moneda: '$',
      costo_envio: '0',
      metodos_pago: 'Efectivo, Transferencia / Depósito',
      estado_local: 'ABIERTO'
    };

    let items = [];
    let activeCat = 'Todos';
    let currentItem = null;
    let modalQty = 1;
    let cart = [];
    let selectedTip = 0;        // Siempre inicia en 0%
    let selectedPayment = '';   // Siempre inicia sin método seleccionado
    let userLocation = null;    // Siempre inicia sin ubicación

    function loadDeliveryPref() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (saved.delivery) {
          const delSelect = document.getElementById('c-delivery');
          if (delSelect) delSelect.value = saved.delivery;
        }
      } catch (e) {}
    }

    function saveDeliveryPref() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          delivery: document.getElementById('c-delivery').value
        }));
      } catch (e) {}
    }

    /* Codificar / Decodificar carrito compartido en #invitar= */
    function encodeInvitePayload() {
      const payload = {
        c: cart.map(item => ({
          n: item.nombre,
          e: item.extras,
          o: item.note,
          p: item.unitPrice,
          q: item.qty
        })),
        d: document.getElementById('c-delivery').value,
        t: selectedTip
      };
      const jsonStr = JSON.stringify(payload);
      return btoa(unescape(encodeURIComponent(jsonStr)));
    }

    function checkInviteHash() {
      const hash = window.location.hash || '';
      if (!hash.startsWith('#invitar=')) return false;

      try {
        const encoded = hash.slice('#invitar='.length);
        const jsonStr = decodeURIComponent(escape(atob(encoded)));
        const payload = JSON.parse(jsonStr);

        if (Array.isArray(payload.c) && payload.c.length > 0) {
          cart = payload.c.map(x => ({
            uid: Date.now() + Math.random(),
            nombre: String(x.n || ''),
            extras: Array.isArray(x.e) ? x.e : [],
            note: String(x.o || ''),
            unitPrice: Number(x.p) || 0,
            qty: Math.max(1, Number(x.q) || 1)
          }));

          if (payload.d) {
            document.getElementById('c-delivery').value = payload.d;
          }
          selectedTip = typeof payload.t === 'number' ? payload.t : 0;
          selectedPayment = '';
          userLocation = null;

          // Limpiar el hash de la URL sin recargar
          history.replaceState(null, '', window.location.pathname + window.location.search);

          updateTipButtons();
          updateCartBar();
          document.getElementById('invite-banner').style.display = 'block';
          openCartModal();
          return true;
        }
      } catch (err) {
        console.warn('No se pudo leer el enlace de invitación:', err);
      }
      return false;
    }

    function resetOrderState() {
      cart = [];
      selectedTip = 0;
      selectedPayment = '';
      userLocation = null;

      const gpsBtn = document.getElementById('gps-btn');
      const gpsErr = document.getElementById('gps-error');
      if (gpsBtn) {
        gpsBtn.classList.remove('ready');
        gpsBtn.textContent = '📍 Dar mi ubicación actual';
      }
      if (gpsErr) {
        gpsErr.style.display = 'none';
        gpsErr.textContent = '';
      }
      const inviteBanner = document.getElementById('invite-banner');
      if (inviteBanner) inviteBanner.style.display = 'none';

      updateTipButtons();
      renderPaymentOptions();
      updateCartBar();
    }

    function parseCSV(text) {
      const rows = [];
      let row = [], val = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (ch === '"' && inQuotes && next === '"') { val += '"'; i++; }
        else if (ch === '"') { inQuotes = !inQuotes; }
        else if (ch === ',' && !inQuotes) { row.push(val.trim()); val = ''; }
        else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(val.trim());
          if (row.some(cell => cell !== '')) rows.push(row);
          row = []; val = '';
        } else { val += ch; }
      }
      if (row.length || val) { row.push(val.trim()); rows.push(row); }
      return rows;
    }

    async function loadData() {
      loadDeliveryPref();
      try {
        const cfgRes = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Config`);
        const cfgRows = parseCSV(await cfgRes.text()).slice(1);
        cfgRows.forEach(([k, v]) => { if (k) config[k] = v; });

        const menuRes = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Menu_Inventario`);
        const menuRows = parseCSV(await menuRes.text()).slice(1);
        items = menuRows.map(r => ({
          id: r[0],
          categoria: r[1] || 'General',
          nombre: r[2] || '',
          descripcion: r[3] || '',
          precio: parseFloat(r[4]) || 0,
          imagen: r[5] || '',
          extras: (r[6] || '').split(',').map(e => e.trim()).filter(Boolean).map(e => {
            const [label, price] = e.split(':');
            return { label: label.trim(), price: parseFloat(price) || 0 };
          }),
          estado: (r[7] || 'DISPONIBLE').toUpperCase()
        })).filter(x => x.nombre);
      } catch (e) {
        console.warn('Usando datos de respaldo si no hay conexión al Sheet:', e);
        items = [
          { id: '1', categoria: 'Hamburguesas', nombre: 'Doble Queso', descripcion: 'Doble carne y cheddar', precio: 6.5, imagen: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80', extras: [{ label: 'Extra tocino', price: 1 }], estado: 'DISPONIBLE' }
        ];
      }
      applyTheme();
      renderCategories();
      renderMenu();
      updateTipButtons();
      checkInviteHash();
    }

    function applyTheme() {
      document.documentElement.style.setProperty('--primary', config.color_principal || '#E63946');
      document.documentElement.style.setProperty('--bg', config.color_fondo || '#111315');
      document.title = config.nombre_negocio;
      document.getElementById('biz-name').textContent = config.nombre_negocio;
      document.getElementById('biz-slogan').textContent = config.slogan;
      if (config.logo_url) document.getElementById('logo').src = config.logo_url;

      const statusEl = document.getElementById('biz-status');
      const abierto = (config.estado_local || 'ABIERTO').toUpperCase() === 'ABIERTO';
      statusEl.textContent = abierto ? 'ABIERTO' : 'CERRADO';
      statusEl.className = abierto ? 'badge' : 'badge cerrado';

      renderPaymentOptions();
    }

    function renderPaymentOptions() {
      const methods = (config.metodos_pago || 'Efectivo, Transferencia / Depósito')
        .split(',')
        .map(m => m.trim())
        .filter(Boolean);

      if (selectedPayment && !methods.includes(selectedPayment)) {
        selectedPayment = '';
      }

      const container = document.getElementById('pay-options');
      container.innerHTML = methods.map(m => `
        <div class="pay-card ${m === selectedPayment ? 'selected' : ''}" onclick="selectPayment('${m.replace(/'/g, "\\'")}')">
          <span class="pay-radio"></span>
          <span>${m}</span>
        </div>
      `).join('');
    }

    function selectPayment(method) {
      selectedPayment = method;
      renderPaymentOptions();
      renderCart();
    }

    function renderCategories() {
      const cats = ['Todos', ...new Set(items.map(i => i.categoria))];
      const el = document.getElementById('cats');
      el.innerHTML = cats.map(c => `<button class="cat-btn ${c === activeCat ? 'active' : ''}" onclick="selectCat('${c.replace(/'/g, "\\'")}')">${c}</button>`).join('');
    }

    function selectCat(cat) {
      activeCat = cat;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const list = activeCat === 'Todos' ? items : items.filter(i => i.categoria === activeCat);
      const container = document.getElementById('menu');
      container.innerHTML = list.map(item => {
        const agotado = item.estado === 'AGOTADO';
        return `
          <div class="item ${agotado ? 'agotado' : ''}" onclick="${agotado ? '' : `openItemModal('${item.id}')`}">
            ${item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" loading="lazy" />` : ''}
            <div class="item-body">
              <div>
                <div class="item-title">${item.nombre}</div>
                <div class="item-desc">${item.descripcion}</div>
              </div>
              <div class="item-foot">
                <span class="price">${config.moneda}${item.precio.toFixed(2)}</span>
                ${agotado ? '<span class="tag-agotado">AGOTADO</span>' : '<span style="font-size:12px; color:var(--muted);">Elegir +</span>'}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openItemModal(id) {
      currentItem = items.find(i => i.id === id);
      if (!currentItem) return;
      modalQty = 1;

      const hero = document.getElementById('m-hero');
      const img = document.getElementById('m-img');
      if (currentItem.imagen) {
        img.src = currentItem.imagen;
        img.alt = currentItem.nombre;
        hero.classList.remove('no-img');
        img.style.display = 'block';
      } else {
        hero.classList.add('no-img');
        img.style.display = 'none';
      }

      document.getElementById('m-title').textContent = currentItem.nombre;
      document.getElementById('m-price').textContent = `${config.moneda}${currentItem.precio.toFixed(2)}`;
      document.getElementById('m-desc').textContent = currentItem.descripcion;
      document.getElementById('m-note').value = '';
      document.getElementById('m-qty').textContent = '1';

      const extrasWrap = document.getElementById('m-extras-wrap');
      if (currentItem.extras && currentItem.extras.length > 0) {
        extrasWrap.style.display = 'block';
        document.getElementById('m-extras').innerHTML = currentItem.extras.map((ex, idx) => `
          <label class="extra-card" id="ex-card-${idx}">
            <span class="extra-left">
              <input type="checkbox" class="ex-check" data-idx="${idx}" onchange="toggleExtraCard(${idx})" />
              <span>${ex.label}</span>
            </span>
            <span class="extra-price">+${config.moneda}${ex.price.toFixed(2)}</span>
          </label>
        `).join('');
      } else {
        extrasWrap.style.display = 'none';
        document.getElementById('m-extras').innerHTML = '';
      }

      updateModalAddButton();
      document.getElementById('m-add-btn').onclick = addCurrentToCart;
      openModalWithHistory('item-modal');
    }

    function toggleExtraCard(idx) {
      const card = document.getElementById(`ex-card-${idx}`);
      const chk = card.querySelector('input[type="checkbox"]');
      card.classList.toggle('selected', chk.checked);
      updateModalAddButton();
    }

    function changeModalQty(delta) {
      modalQty = Math.max(1, modalQty + delta);
      document.getElementById('m-qty').textContent = modalQty;
      updateModalAddButton();
    }

    function updateModalAddButton() {
      if (!currentItem) return;
      const checked = [...document.querySelectorAll('.ex-check:checked')].map(el => currentItem.extras[el.dataset.idx]);
      const extrasTotal = checked.reduce((acc, e) => acc + e.price, 0);
      const total = (currentItem.precio + extrasTotal) * modalQty;
      document.getElementById('m-add-btn').textContent = `Agregar (${modalQty}) • ${config.moneda}${total.toFixed(2)}`;
    }

    function addCurrentToCart() {
      const checked = [...document.querySelectorAll('.ex-check:checked')].map(el => currentItem.extras[el.dataset.idx]);
      const extrasTotal = checked.reduce((acc, e) => acc + e.price, 0);
      const unitPrice = currentItem.precio + extrasTotal;
      const note = document.getElementById('m-note').value.trim();

      cart.push({
        uid: Date.now() + Math.random(),
        nombre: currentItem.nombre,
        extras: checked.map(e => e.label),
        note,
        unitPrice,
        qty: modalQty
      });
      closeModal('item-modal');
      updateCartBar();
    }

    function updateCartBar() {
      const count = cart.reduce((a, b) => a + b.qty, 0);
      const sub = cart.reduce((a, b) => a + b.unitPrice * b.qty, 0);
      const bar = document.getElementById('cart-bar');
      if (count === 0) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      document.getElementById('cart-count').textContent = `${count} producto(s) — Ver pedido`;
      document.getElementById('cart-total').textContent = `${config.moneda}${sub.toFixed(2)}`;
    }

    function openCartModal() {
      renderPaymentOptions();
      updateTipButtons();
      renderCart();
      openModalWithHistory('cart-modal');
    }

    function selectTip(pct) {
      selectedTip = pct;
      updateTipButtons();
      renderCart();
    }

    function updateTipButtons() {
      document.querySelectorAll('.tip-btn').forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.tip) === selectedTip);
      });
    }

    function onDeliveryChange() {
      saveDeliveryPref();
      renderCart();
    }

    function captureLocation() {
      const btn = document.getElementById('gps-btn');
      const errEl = document.getElementById('gps-error');
      errEl.style.display = 'none';

      if (!navigator.geolocation) {
        errEl.textContent = 'Tu navegador no soporta ubicación GPS.';
        errEl.style.display = 'block';
        return;
      }

      btn.textContent = '⏳ Obteniendo ubicación...';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          userLocation = {
            lat,
            lng,
            url: `https://maps.google.com/?q=${lat},${lng}`
          };
          btn.classList.add('ready');
          btn.textContent = '✓ Ubicación lista';
          renderCart();
        },
        () => {
          btn.classList.remove('ready');
          btn.textContent = '📍 Dar mi ubicación actual';
          errEl.textContent = 'No se pudo obtener tu ubicación. Activa el GPS y permite el acceso.';
          errEl.style.display = 'block';
          renderCart();
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function getOrderTotals() {
      const delivery = document.getElementById('c-delivery').value;
      const sub = cart.reduce((a, b) => a + b.unitPrice * b.qty, 0);
      const tipAmount = sub * (selectedTip / 100);
      const env = delivery === 'Domicilio' ? (parseFloat(config.costo_envio) || 0) : 0;
      const total = sub + tipAmount + env;
      return { delivery, sub, tipAmount, env, total };
    }

    function renderCart() {
      const box = document.getElementById('cart-items');
      const actions = document.getElementById('cart-actions');
      if (cart.length === 0) {
        box.innerHTML = '<p style="color:var(--muted); text-align:center; padding: 24px 0;">Tu carrito está vacío.</p>';
        document.getElementById('cart-summary').innerHTML = '';
        actions.style.display = 'none';
        return;
      }
      actions.style.display = 'flex';

      box.innerHTML = cart.map((c, i) => `
        <div class="cart-row">
          <div>
            <div style="font-weight:700; font-size:15px;">${c.nombre}</div>
            ${c.extras.length ? `<div style="font-size:12px; color:var(--muted); margin-top:2px;">+ ${c.extras.join(', ')}</div>` : ''}
            ${c.note ? `<div style="font-size:12px; color:#fbbf24; margin-top:2px;">Nota: ${c.note}</div>` : ''}
            <div style="font-size:14px; font-weight:700; color:var(--primary); margin-top:4px;">${config.moneda}${(c.unitPrice * c.qty).toFixed(2)}</div>
          </div>
          <div class="qty-box">
            <button type="button" onclick="changeQty(${i}, -1)">−</button>
            <span style="min-width:20px; text-align:center; font-weight:700;">${c.qty}</span>
            <button type="button" onclick="changeQty(${i}, 1)">+</button>
          </div>
        </div>
      `).join('');

      const { delivery, sub, tipAmount, env, total } = getOrderTotals();
      const gpsField = document.getElementById('gps-field');
      gpsField.style.display = delivery === 'Domicilio' ? 'block' : 'none';

      const sendBtn = document.getElementById('send-wa-btn');
      if (delivery === 'Domicilio' && !userLocation) {
        sendBtn.disabled = true;
        sendBtn.textContent = '📍 Activa tu ubicación para enviar';
      } else if (!selectedPayment) {
        sendBtn.disabled = true;
        sendBtn.textContent = '💳 Elige un método de pago';
      } else {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Enviar pedido por WhatsApp';
      }

      document.getElementById('cart-summary').innerHTML = `
        <div class="summary-line"><span>Subtotal</span><b>${config.moneda}${sub.toFixed(2)}</b></div>
        <div class="summary-line"><span>Propina (${selectedTip}%)</span><b>${config.moneda}${tipAmount.toFixed(2)}</b></div>
        <div class="summary-line"><span>Envío (${delivery})</span><b>${config.moneda}${env.toFixed(2)}</b></div>
        <div class="summary-total"><span>Total a pagar</span><span>${config.moneda}${total.toFixed(2)}</span></div>
      `;
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      updateCartBar();
      renderCart();
    }

    /* Historial y cierre de modales sin salir de la web */
    function openModalWithHistory(id) {
      const el = document.getElementById(id);
      const sheet = el.querySelector('.modal-fs');
      if (sheet) sheet.style.transform = 'translateX(0)';
      el.classList.add('open');
      if (!history.state || history.state.modal !== id) {
        history.pushState({ modal: id }, '');
      }
    }

    function closeModal(id, fromPopState = false) {
      const el = document.getElementById(id);
      if (!el || !el.classList.contains('open')) return;
      el.classList.remove('open');
      const sheet = el.querySelector('.modal-fs');
      if (sheet) sheet.style.transform = 'translateX(0)';
      if (!fromPopState && history.state && history.state.modal === id) {
        history.back();
      }
    }

    window.addEventListener('popstate', () => {
      closeModal('item-modal', true);
      closeModal('cart-modal', true);
    });

    /* Gesto táctil de izquierda a derecha para volver atrás */
    function attachSwipeBack(modalId) {
      const backdrop = document.getElementById(modalId);
      const sheet = backdrop.querySelector('.modal-fs');
      let startX = 0, startY = 0, currentX = 0, dragging = false;

      sheet.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        currentX = 0;
        dragging = true;
        sheet.style.transition = 'none';
      }, { passive: true });

      sheet.addEventListener('touchmove', (e) => {
        if (!dragging) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;

        if (Math.abs(dy) > Math.abs(dx) && currentX === 0) {
          dragging = false;
          sheet.style.transition = 'transform 0.22s ease-out';
          return;
        }

        if (dx > 0) {
          currentX = dx;
          sheet.style.transform = `translateX(${dx}px)`;
        }
      }, { passive: true });

      sheet.addEventListener('touchend', () => {
        if (!dragging) return;
        dragging = false;
        sheet.style.transition = 'transform 0.22s ease-out';
        if (currentX > 90) {
          sheet.style.transform = 'translateX(100%)';
          setTimeout(() => closeModal(modalId), 160);
        } else {
          sheet.style.transform = 'translateX(0)';
        }
      });
    }

    attachSwipeBack('item-modal');
    attachSwipeBack('cart-modal');

    function openNativeWhatsApp(phone, text) {
      const encoded = encodeURIComponent(text);
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const waAppUrl = phone
        ? `whatsapp://send?phone=${phone}&text=${encoded}`
        : `whatsapp://send?text=${encoded}`;
      const waWebUrl = phone
        ? `https://wa.me/${phone}?text=${encoded}`
        : `https://wa.me/?text=${encoded}`;

      if (isMobile) {
        window.location.href = waAppUrl;
      } else {
        window.location.href = waWebUrl;
      }
    }

    function sendWhatsApp() {
      if (!cart.length) return;
      const { delivery, sub, tipAmount, env, total } = getOrderTotals();
      if (delivery === 'Domicilio' && !userLocation) {
        renderCart();
        return;
      }
      if (!selectedPayment) {
        renderCart();
        return;
      }

      let lines = [`*Nuevo pedido — ${config.nombre_negocio}*`, `Entrega: ${delivery}`];
      if (delivery === 'Domicilio' && userLocation) {
        lines.push(`📍 Ubicación: ${userLocation.url}`);
      }
      lines.push(`Pago: ${selectedPayment}`, '', '*Detalle:*');

      cart.forEach(c => {
        lines.push(`• ${c.qty}x ${c.nombre} (${config.moneda}${(c.unitPrice * c.qty).toFixed(2)})`);
        if (c.extras.length) lines.push(`   Extras: ${c.extras.join(', ')}`);
        if (c.note) lines.push(`   Nota: ${c.note}`);
      });

      lines.push('', `Subtotal: ${config.moneda}${sub.toFixed(2)}`);
      if (tipAmount > 0) lines.push(`Propina (${selectedTip}%): ${config.moneda}${tipAmount.toFixed(2)}`);
      if (env > 0) lines.push(`Envío: ${config.moneda}${env.toFixed(2)}`);
      lines.push(`*Total a pagar: ${config.moneda}${total.toFixed(2)}*`);

      const phone = (config.whatsapp || '').replace(/\D/g, '');
      const message = lines.join('\n');

      // Reiniciar carrito, propina (0%), pago (vacío) y ubicación (null), y volver al menú
      resetOrderState();
      closeModal('cart-modal');

      openNativeWhatsApp(phone, message);
    }

    function shareInviteWhatsApp() {
      if (!cart.length) return;
      const { total } = getOrderTotals();
      const baseUrl = window.location.href.split('#')[0];
      const inviteLink = `${baseUrl}#invitar=${encodeInvitePayload()}`;

      const lines = [
        `🎁 *¡Tu amig@ hoy invita!*`,
        `Ya tengo listo el carrito en *${config.nombre_negocio}* (Total aprox: ${config.moneda}${total.toFixed(2)}).`,
        `Abre este enlace para ir directo al carrito y hacer el pedido:`,
        inviteLink
      ];

      openNativeWhatsApp('', lines.join('\n'));
    }

    loadData();
  </script>
